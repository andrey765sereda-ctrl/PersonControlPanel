<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Настройки">

    <title>Настройки</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Настройки</h1>

        <section class="section">
            <h2>Действия</h2>

            <div class="settings-card">
                <div class="setting">
                    <span>Выключить рот</span>

                    <label class="switch">
                        <input type="checkbox" id="mouthToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <section class="section">
            <h2>Настроение</h2>

            <div class="settings-card">

                <div class="setting">
                    <span>Весёлый</span>

                    <label class="switch">
                        <input type="radio" name="mood" value="happy" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span>Грустный</span>

                    <label class="switch">
                        <input type="radio" name="mood" value="sad">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span>Мимика</span>

                    <label class="switch">
                        <input type="radio" name="mood" value="expression">
                        <span class="slider"></span>
                    </label>
                </div>

            </div>
        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
