<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#08080c"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Настройки Андрея"
    >

    <title>Настройки Андрея</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>
    </div>


    <main class="container">

        <header class="header">

            <h1>Настройки Андрея</h1>

            <button
                class="save-button"
                id="saveButton"
                type="button"
            >
                <span class="save-button-text">
                    Сохранить
                </span>
            </button>

        </header>


        <!-- ПОВЕДЕНИЕ -->

        <section class="section">

            <h2>Поведение</h2>

            <div class="glass-card">

                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Ласковый
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="behavior-toggle"
                            value="gentle"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="divider"></div>


                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Грубый
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="behavior-toggle"
                            value="rough"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="divider"></div>


                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Жёсткий
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="behavior-toggle"
                            value="hard"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="divider"></div>


                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Доминантный
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="behavior-toggle"
                            value="dominant"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="divider"></div>


                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Внимательный
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="behavior-toggle"
                            value="attentive"
                        >

                        <span class="slider"></span>

                    </label>

                </div>

            </div>

        </section>


        <!-- НАСТРОЕНИЕ -->

        <section class="section">

            <h2>Настроение</h2>

            <div class="glass-card">

                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Весёлый
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="mood-toggle"
                            value="happy"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="divider"></div>


                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Грустный
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="mood-toggle"
                            value="sad"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="divider"></div>


                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Ситуативный
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="mood-toggle"
                            value="situational"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="divider"></div>


                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Добрый
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="mood-toggle"
                            value="kind"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="divider"></div>


                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Любящий
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="mood-toggle"
                            value="loving"
                        >

                        <span class="slider"></span>

                    </label>

                </div>

            </div>

        </section>


        <!-- ДЕЙСТВИЕ -->

        <section class="section">

            <h2>Действие</h2>

            <div class="glass-card">

                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Мозг 200%
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="action-toggle"
                            value="brain200"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="divider"></div>


                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Концентрация
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="action-toggle"
                            value="concentration"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="divider"></div>


                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Работа
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="action-toggle"
                            value="work"
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="divider"></div>


                <div class="setting">

                    <div class="setting-text">
                        <span class="title">
                            Выключить рот
                        </span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            class="action-toggle"
                            value="mouthDisabled"
                        >

                        <span class="slider"></span>

                    </label>

                </div>

            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
