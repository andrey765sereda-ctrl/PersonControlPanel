<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#08080c"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Настройки Андрея"
    >

    <title>Настройки Андрея</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>
    </div>


    <main class="container">

        <header class="header">

            <h1>Настройки Андрея</h1>

            <button
                id="saveButton"
                class="save-button"
                type="button"
            >
                Сохранить
            </button>

        </header>


        <section class="section">

            <h2>Поведение</h2>

            <div class="glass-card">

                <div class="setting">
                    <span class="title">Ласковый</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="behavior-toggle"
                            value="gentle"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span class="title">Грубый</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="behavior-toggle"
                            value="rough"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span class="title">Жёсткий</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="behavior-toggle"
                            value="hard"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span class="title">Доминантный</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="behavior-toggle"
                            value="dominant"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span class="title">Внимательный</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="behavior-toggle"
                            value="attentive"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

            </div>

        </section>


        <section class="section">

            <h2>Настроение</h2>

            <div class="glass-card">

                <div class="setting">
                    <span class="title">Весёлый</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="mood-toggle"
                            value="happy"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span class="title">Грустный</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="mood-toggle"
                            value="sad"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span class="title">Ситуативный</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="mood-toggle"
                            value="situational"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span class="title">Добрый</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="mood-toggle"
                            value="kind"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span class="title">Любящий</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="mood-toggle"
                            value="loving"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

            </div>

        </section>


        <section class="section">

            <h2>Действие</h2>

            <div class="glass-card">

                <div class="setting">
                    <span class="title">Мозг 200%</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="action-toggle"
                            value="brain200"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span class="title">Концентрация</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="action-toggle"
                            value="concentration"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span class="title">Работа</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="action-toggle"
                            value="work"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting">
                    <span class="title">Выключить рот</span>

                    <label class="switch">
                        <input
                            type="checkbox"
                            class="action-toggle"
                            value="mouthDisabled"
                        >
                        <span class="slider"></span>
                    </label>
                </div>

            </div>

        </section>

    </main>


    <script src="./app.js"></script>

</body>

</html>
